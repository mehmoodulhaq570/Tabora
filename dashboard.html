<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabora</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="dashboard-body">
    <div id="dashboardBackdrop" class="dashboard-backdrop" aria-hidden="true"></div>

    <div class="dashboard-shell">
      <header class="page-header">
        <nav id="pageTabs" class="page-tabs" aria-label="Pages"></nav>
        <button id="addPageButton" class="square-button" title="Add page" aria-label="Add page"><span class="icon-plus"></span></button>
      </header>

      <div id="pageFormPanel" class="inline-panel page-form-panel" hidden>
        <form id="pageForm">
          <label class="sr-only" for="pageName">Page name</label>
          <input id="pageName" class="dark-input" placeholder="Page name" maxlength="40" autocomplete="off">
          <button class="accent-button" type="submit">Add</button>
          <button id="cancelPage" class="danger-icon-button" type="button" aria-label="Cancel">&times;</button>
        </form>
      </div>

      <div id="searchPanel" class="floating-search" hidden>
        <span class="icon-search"></span>
        <input id="globalSearch" type="search" placeholder="Search boards, links, or URLs" autocomplete="off">
        <button id="clearSearch" class="plain-icon-button" aria-label="Clear search">&times;</button>
      </div>

      <main class="workspace-main">
        <section id="boardGrid" class="board-grid" aria-live="polite"></section>
      </main>
    </div>

    <aside class="tool-rail" aria-label="Tabora tools">
      <button id="searchTool" class="rail-button" title="Search" aria-label="Search"><span class="icon-search"></span></button>
      <button id="importTool" class="rail-button" title="Import" aria-label="Import"><span class="icon-import"></span></button>
      <button id="incognitoTool" class="rail-button" title="Open links privately" aria-label="Open links privately"><span class="icon-incognito"></span></button>
      <button id="organizeTool" class="rail-button" title="Organize" aria-label="Organize"><span class="icon-organize"></span></button>
      <button id="trashTool" class="rail-button" title="Trash" aria-label="Trash"><span class="icon-trash"></span></button>
      <button id="privacyTool" class="rail-button" title="Privacy mode" aria-label="Privacy mode"><span class="icon-eye"></span></button>
      <button id="settingsTool" class="rail-button accent-rail" title="Settings" aria-label="Settings"><span class="icon-settings"></span></button>
    </aside>

    <button id="wallpaperTool" class="wallpaper-button" title="Wallpaper" aria-label="Wallpaper"><span class="icon-image"></span></button>

    <div id="contextMenu" class="context-menu" hidden></div>

    <dialog id="boardDialog" class="app-dialog small-dialog">
      <form id="boardForm">
        <header class="dialog-header"><div><span class="eyebrow">New collection</span><h2 id="boardDialogTitle">Add board</h2></div><button class="dialog-close" type="button" data-close-dialog="boardDialog" aria-label="Close">&times;</button></header>
        <label for="boardName">Board name</label>
        <input id="boardName" class="dark-input" placeholder="AI Tools" maxlength="60" autocomplete="off">
        <input id="editingBoardId" type="hidden">
        <footer class="dialog-footer"><button class="secondary-button" type="button" data-close-dialog="boardDialog">Cancel</button><button class="accent-button" type="submit">Save board</button></footer>
      </form>
    </dialog>

    <dialog id="linkDialog" class="app-dialog">
      <form id="linkForm">
        <header class="dialog-header"><div><span class="eyebrow">Bookmark</span><h2 id="linkDialogTitle">Add link</h2></div><button class="dialog-close" type="button" data-close-dialog="linkDialog" aria-label="Close">&times;</button></header>
        <label for="linkTitle">Title</label><input id="linkTitle" class="dark-input" placeholder="Project documentation" maxlength="60">
        <label for="linkUrl">URL</label><input id="linkUrl" class="dark-input" type="text" placeholder="https://example.com" required>
        <label for="linkNote">Note <span>optional</span></label><textarea id="linkNote" class="dark-input" placeholder="Why this link matters" maxlength="180"></textarea>
        <input id="linkBoardId" type="hidden"><input id="editingLinkId" type="hidden">
        <footer class="dialog-footer"><button class="secondary-button" type="button" data-close-dialog="linkDialog">Cancel</button><button class="accent-button" type="submit">Save link</button></footer>
      </form>
    </dialog>

    <dialog id="importDialog" class="app-dialog wide-dialog">
      <form id="importForm">
        <header class="dialog-header"><div><span class="eyebrow">Bring your links</span><h2>Import to Tabora</h2></div><button class="dialog-close" type="button" data-close-dialog="importDialog" aria-label="Close">&times;</button></header>
        <div class="import-options">
          <button class="import-option" type="button" data-import="bookmarks"><span class="icon-bookmark"></span><strong>Browser bookmarks</strong><small>Copy folders and bookmarks from Brave</small></button>
          <button class="import-option" type="button" data-import="window"><span class="icon-window"></span><strong>Current window</strong><small>Turn every open tab into one board</small></button>
          <button class="import-option" type="button" data-import="text"><span class="icon-paste"></span><strong>Paste links</strong><small>One URL per line, optionally title | URL</small></button>
          <label class="import-option file-option"><span class="icon-file"></span><strong>Upload a file</strong><small>HTML, CSV, or text</small><input id="importFile" type="file" accept=".html,.htm,.csv,.txt"></label>
        </div>
        <div id="textImportPanel" class="text-import-panel" hidden>
          <label for="importText">Links to import</label>
          <textarea id="importText" class="dark-input" placeholder="Documentation | https://example.com/docs&#10;https://another.example"></textarea>
          <div class="dialog-footer"><button id="confirmTextImport" class="accent-button" type="button">Import links</button></div>
        </div>
        <div id="importPreview" class="import-preview" hidden>
          <div><span class="eyebrow">Ready to import</span><h3 id="importPreviewTitle"></h3><p id="importPreviewDetails"></p></div>
          <div id="importPreviewBoards" class="preview-board-list"></div>
          <div class="dialog-footer"><button id="cancelImportPreview" class="secondary-button" type="button">Back</button><button id="commitImport" class="accent-button" type="button">Import now</button></div>
        </div>
      </form>
    </dialog>

    <dialog id="trashDialog" class="app-dialog wide-dialog">
      <div class="dialog-content">
        <header class="dialog-header"><div><span class="eyebrow">Recoverable items</span><h2>Trash</h2></div><button class="dialog-close" type="button" data-close-dialog="trashDialog" aria-label="Close">&times;</button></header>
        <div id="trashList" class="trash-list"></div>
        <footer class="dialog-footer"><button id="emptyTrash" class="danger-button" type="button">Empty trash</button></footer>
      </div>
    </dialog>

    <section id="appearancePanel" class="appearance-panel" aria-label="Appearance" hidden>
      <header class="appearance-header"><h2>Style</h2></header>
      <div class="appearance-body">
        <div class="segmented-control"><button type="button" data-theme="dark">Dark</button><button type="button" data-theme="light">Light</button></div>
        <div class="appearance-title"><strong>Starter wallpapers</strong><span id="wallpaperCount"></span></div>
        <div id="wallpaperGrid" class="wallpaper-grid"></div>
      </div>
      <footer class="appearance-footer">
        <label class="secondary-button upload-wallpaper-button">Upload Wallpaper<input id="wallpaperUpload" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <button id="moreWallpapers" class="secondary-button" type="button">More Wallpapers</button>
      </footer>
    </section>

    <div id="onboardingCard" class="onboarding-card" hidden>
      <strong>Step 1 of 3: Create your first board</strong>
      <p>Click Add Board, type a name, then save it.</p>
      <button id="skipOnboarding" class="secondary-button">Skip tour</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="shared.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
