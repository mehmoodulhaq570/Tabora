<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabora</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand"><img class="popup-brand-icon" src="icons/tabora-32.png" width="28" height="28" alt=""><span>Tabora</span></div>
        <button id="openDashboard" class="square-button" title="Open Tabora" aria-label="Open Tabora"><svg class="popup-header-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"></rect><rect x="15" y="3" width="6" height="6" rx="1"></rect><rect x="3" y="15" width="6" height="6" rx="1"></rect><rect x="15" y="15" width="6" height="6" rx="1"></rect></svg></button>
      </header>

      <section class="quick-panel">
        <label class="field-label" for="captureName">Save current window as a board</label>
        <input id="captureName" class="text-input" placeholder="Research session" maxlength="60">
        <div class="quick-row">
          <select id="capturePage" class="select-input" aria-label="Destination page"></select>
          <button id="saveWindow" class="accent-button"><svg class="popup-button-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 8h18M12 11v5M9.5 13.5 12 16l2.5-2.5"></path></svg>Save window</button>
        </div>
        <label class="field-label" for="targetBoard">Or add this tab to a board</label>
        <div class="quick-row">
          <select id="targetBoard" class="select-input" aria-label="Destination board"></select>
          <button id="addCurrentTab" class="secondary-button"><svg class="popup-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a4.5 4.5 0 0 0 6.4.1l2-2a4.5 4.5 0 0 0-6.3-6.4l-1.2 1.2"></path><path d="M14 11a4.5 4.5 0 0 0-6.4-.1l-2 2a4.5 4.5 0 0 0 6.3 6.4l1.2-1.2M19 16v5M16.5 18.5h5"></path></svg>Add tab</button>
        </div>
      </section>

      <label class="popup-search">
        <svg class="popup-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"></circle><path d="m16.5 16.5 4 4"></path></svg>
        <input id="popupSearch" type="search" placeholder="Search boards and links" autocomplete="off">
      </label>
      <div id="popupStatus" class="popup-status" role="status" aria-live="polite" hidden></div>

      <section class="section-block">
        <div class="section-title">Recent boards</div>
        <div id="recentBoards" class="popup-board-list"></div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
