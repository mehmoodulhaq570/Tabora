<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabora</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Tabora</span></div>
        <button id="openDashboard" class="square-button" title="Open Tabora" aria-label="Open Tabora"><span class="icon-organize"></span></button>
      </header>

      <section class="quick-panel">
        <label class="field-label" for="captureName">Save current window as a board</label>
        <input id="captureName" class="text-input" placeholder="Research session" maxlength="60">
        <div class="quick-row">
          <select id="capturePage" class="select-input" aria-label="Destination page"></select>
          <button id="saveWindow" class="accent-button">Save window</button>
        </div>
        <label class="field-label" for="targetBoard">Or add this tab to a board</label>
        <div class="quick-row">
          <select id="targetBoard" class="select-input" aria-label="Destination board"></select>
          <button id="addCurrentTab" class="secondary-button">Add tab</button>
        </div>
      </section>

      <label class="popup-search">
        <span class="icon-search"></span>
        <input id="popupSearch" type="search" placeholder="Search boards and links" autocomplete="off">
      </label>

      <section class="section-block">
        <div class="section-title">Recent boards</div>
        <div id="recentBoards" class="popup-board-list"></div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
